name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  actions: read
  # security-events: write  # CHANGE_ME: Uncomment when enabling the custom CodeQL job below

jobs:
  audit:
    name: Dependency Audit & SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit || true
      - run: pnpm list --json > dependency-inventory.json
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-inventory
          path: dependency-inventory.json
          retention-days: 30

  # CHANGE_ME: Uncomment this job for personal accounts or organizations where GitHub Default CodeQL Setup is disabled.
  # Organization-managed repositories with Default CodeQL Setup enabled run CodeQL automatically and reject duplicate SARIF uploads.
